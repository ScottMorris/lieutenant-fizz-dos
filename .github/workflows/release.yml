# Builds a release's files (tools/make-release.sh) and, for a pushed tag such as v0.1.0, publishes them as a GitHub release with the
# changelog's section for that version as its notes. Run by hand (Actions, Release, Run workflow) it builds the files and keeps them
# as a workflow artifact without publishing.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build the files for, such as v0.1.0 (nothing is published)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  # The build image: .github/images/dos-build, published by image.yml under a tag that hashes what it is built from.
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml

  release:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        working-directory: experiments/fizz-dos
    steps:
      # Laid out as ci.yml does: the repository and the main game side by side.
      - uses: actions/checkout@v7
        with:
          path: experiments/fizz-dos
      - uses: actions/checkout@v7
        with:
          repository: liminal-hq/lieutenant-fizz
          path: liminal-hq/lieutenant-fizz
      - name: Build the main game's sim.wasm
        working-directory: liminal-hq/lieutenant-fizz
        run: |
          bun install --frozen-lockfile
          bun run build:wasm
      # The image's DOS toolchain becomes vendor/ (DOS_TOOLCHAIN).
      - name: Set up this repository
        run: tools/setup.sh --no-clone
      # A release is never made from a tree that fails the checks.
      - name: Check
        run: tools/check.sh
      - name: Build the game
        run: m4/build.sh --no-run
      # The browser bundle is rebuilt from this build's FIZZ.EXE: a build on another machine is not byte for byte the one committed in
      # site/game.jsdos.
      - name: Build the browser bundle
        run: tools/make-site.sh
      - name: Build the release files
        run: tools/make-release.sh "$VERSION"
      - name: Keep the files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: experiments/fizz-dos/dist/release/*

  # The image has no `gh`, and publishing needs only the files and the changelog.
  publish:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${VERSION#v}"
          # The changelog's section for this version is the release's notes.
          awk -v n="$number" '$0 ~ "^## " n " " { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > release/NOTES.md
          [ -s release/NOTES.md ] || { echo "CHANGELOG.md has no section for $number" >&2; exit 1; }
          # A 0.x release is a pre-release: the port is playable but not complete.
          flags=()
          case "$number" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Lieutenant Fizz for DOS $VERSION" \
            --notes-file release/NOTES.md "${flags[@]}" \
            release/*.img release/*.zip release/*.jsdos release/SHA256SUMS
