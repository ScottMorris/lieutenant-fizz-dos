# DOSBox settings for the copy that runs in the browser (js-dos). The desktop settings are in tools/dosbox.conf.
[sdl]
fullscreen = false

[cpu]
core = auto
cputype = auto
cycles = max

[sblaster]
sbtype = sb2
sbbase = 220
irq = 7
dma = 1
oplmode = opl2
oplemu = compat

[mixer]
rate = 44100
blocksize = 1024
# js-dos 8's mixer hands audio to the page in 512-sample pushes and speeds itself up by three times the prebuffer to fill it:
# at 40 ms it makes about 12% more samples than the rate says, the page's time-stretcher (5% at most) cannot keep up, and its
# ring drops samples all the time. At 0 the stream runs at its real rate (the PC speaker test tone measures 440 Hz, not 393).
prebuffer = 0

[autoexec]
mount c .
c:
fizz.exe
