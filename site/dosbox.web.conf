# DOSBox settings for the copy that runs in the browser (js-dos). The desktop settings are in tools/dosbox.conf.
[sdl]
fullscreen = false

[cpu]
core = auto
cputype = auto
cycles = max

[sblaster]
sbtype = sb2
sbbase = 220
irq = 7
dma = 1
oplmode = opl2
oplemu = compat

[mixer]
rate = 44100
blocksize = 1024
prebuffer = 40

[autoexec]
mount c .
c:
fizz.exe
