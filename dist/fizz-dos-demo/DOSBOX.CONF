# DOSBox settings for the Lieutenant Fizz DOS demo. Works with DOSBox Staging and DOSBox-X; classic DOSBox 0.74 ignores what it does not know.
[sdl]
fullscreen = false
windowresolution = 960x720
[render]
aspect = true
[cpu]
core = auto
cycles = max
[sblaster]
sbtype = sb2
oplmode = opl2
# The default OPL emulator (Nuked) is cycle-accurate and slows DOSBox to a crawl on a modest laptop; compat is light.
oplemu = compat
[mixer]
nosound = false
[autoexec]
# The folder DOSBox is started from becomes C:
mount c .
c:
fizz.exe
exit
